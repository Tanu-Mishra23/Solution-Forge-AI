[project]
name = "mindmesh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanu Mishra" }
]
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.15.22",
    "fastapi[standard]>=0.141.1",
    "markdown>=3.10.3",
    "pydantic>=2.12.5",
    "streamlit>=1.64.0",
]

[project.scripts]
mindmesh = "mindmesh:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]
